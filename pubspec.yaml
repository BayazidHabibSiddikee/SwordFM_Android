name: swordfm
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.8.0
  network_info_plus: ^8.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.6
  intl: ^0.20.2
  permission_handler: ^13.0.1
  open_file: ^4.0.0
  mime: ^2.0.0
  flutter_markdown: ^0.7.7+1
  pdfx: ^2.9.2
  pdf: ^3.12.0
  archive: ^4.0.9
  crypto: ^3.0.0
  xml: ^6.5.0
  webdav_client: ^1.2.2
  dio: ^5.1.0
  dartssh2: ^3.3.0
  flutter_secure_storage: ^11.0.0
  pointycastle: ^4.0.0
  file_picker: ^12.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_remote_config: ^6.0.0
  dynamic_color: ^1.7.0
  home_widget: ^0.6.0
  easy_localization: ^3.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  provider: ^6.1.2
  # Media players
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.2
  just_audio: ^0.9.43
  # Background audio playback — keep music playing when the screen locks
  # or the app is backgrounded. Adds a small foreground service and a
  # lock-screen media notification; no audio data ever leaves the device.
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  # Document scanner
  image_picker: ^1.1.2
  # App/Process info
  device_info_plus: ^13.2.0
  installed_apps: ^1.3.1
  # Cloud storage
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  oauth2: ^2.0.3
  webview_flutter: ^4.8.0
  video_thumbnail: ^0.5.6
  # OCR (Tesseract 4 via Tesseract4Android / SwiftyTesseract)
  flutter_tesseract_ocr: ^0.4.31

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Round-trip converter tests under test/round_trip/ use package:test
  # matchers (contains, isNotNull, …) directly.
  test: any

flutter:
  generate: true
  assets:
    - lib/l10n/arb/
    - assets/tessdata_config.json
    - assets/tessdata/
  uses-material-design: true
