name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Run tests before releasing
        run: flutter test

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.SWORDFM_KEYSTORE_BASE64 }}" ]; then
            echo "::error::SWORDFM_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "${{ secrets.SWORDFM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build universal + per-ABI APKs
        env:
          SWORDFM_STORE_FILE: ${{ runner.temp }}/release.p12
          SWORDFM_STORE_PASS: ${{ secrets.SWORDFM_STORE_PASS }}
          SWORDFM_KEY_ALIAS: ${{ secrets.SWORDFM_KEY_ALIAS }}
          SWORDFM_KEY_PASS: ${{ secrets.SWORDFM_KEY_PASS }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify signing key is not the debug key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "── $f"
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/c.log
            if grep -qi 'androiddebugkey\|CN=Android Debug' /tmp/c.log; then
              echo "::error::$f is signed with the debug key"; exit 1
            fi
          done

      - name: Collect sizes and checksums
        run: |
          {
            echo "### SwordFM release artifacts"
            echo
            echo "| APK | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in build/app/outputs/flutter-apk/*-release.apk; do
              SZ=$(echo "scale=1; $(stat -c%s "$f")/1048576" | bc -l)
              echo "| $(basename "$f") | ${SZ} MB | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } | tee /tmp/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: swordfm-apks
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: /tmp/RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/*-release.apk
          draft: true
